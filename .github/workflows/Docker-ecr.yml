name: Docker ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
jobs:
  docker-ecr:
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: checkout Code
        uses: actions/checkout@v4
      - name: build
        run: mvn clean package
        working-directory: github-actions-app
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::283609055440:role/GitHubActions-Testing-Deploy
          aws-region: us-east-1
        
      - name: loginto aws ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build docker image 
        run: |
          docker build -t githubactions:1.0 .
      - name: tag docker image with ecr repository
        run: |
          docker tag githubactions:1.0 283609055440.dkr.ecr.us-east-1.amazonaws.com/githubactions:1.0
          echo "docker images "
          docker images
      - name: Push Docker image to ECR
        run: |
          docker push 283609055440.dkr.ecr.us-east-1.amazonaws.com/githubactions:1.0
