name: AWS OIDC Test

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-test:
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::283609055440:role/GitHubActions-Testing-Deploy
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity