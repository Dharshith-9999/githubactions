name: Maven CI

on:
  push:
    branches:
      - main
env:
  APP_NAME: github-actions
  APP_ENV: production
jobs:
  build:
    strategy:
      matrix:
        java: ['17']
        os: [ubuntu-latest]
        include:
          - java: '17'
            environment: Production
    runs-on: ${{matrix.os}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: display matrix info
        run: |
          echo "java: ${{matrix.java}}"
          echo "environment: ${{matrix.environment}}"
      - name: Display Environment
        run: |
          echo "appname: $APP_NAME"
          echo "appenvironment: $APP_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean package
        working-directory: github-actions-app

      - name: Upload artifacts
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-app
          path: github-actions-app/target/*.jar

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    env:
      JOB_NAME: deploy

    steps:
      - name: Downloading artifacts
        uses: actions/download-artifact@v4
        with:
          name: github-actions-app
          path: app
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Stop old application
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "pkill -f '[g]ithub-actions-app-1.0-SNAPSHOT.jar' || true"
      - name: REmove old jar
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "rm -f /opt/github-action-app/*.jar"
      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem \
            app/*.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/github-actions-app/"

      - name: Verify deployment on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "ls -l /opt/github-actions-app/"
      - name: Start the application
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /opt/github-actions-app && nohup java -jar github-actions-app-1.0-SNAPSHOT.jar > application.log 2>&1 &"
      - name: Verify the application
        run: |
          ssh -v -i ~/.ssh/ec2_key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "ps -ef | grep '[j]ava.*github-actions-app-1.0-SNAPSHOT.jar'"
      - name: create deployment directory
        run: mkdir deployment
      - name: copy jar file from app to deployment
        run: cp -r app/ deployment/
      - name: display job name 
        run: 'echo "the job name: $JOB_NAME"'
      - name: githubsecret
        run: |
          echo "secret configuration"
          echo "secret value: ${{secrets.TEST_SECRET}}"
      - name: github value
        run: |
          echo "github variable configuration"
          echo "variable: ${{vars.DEPLOY_ENV}}"
      - name: github context 
        run: |
          echo "Branch: ${{github.ref}}"
          echo "Triggered by: ${{github.actor}}"
          echo "Repository: ${{github.repository}}"
          echo "commit: ${{github.sha}}"
          echo "workflow: ${{github.workflow}}"
          echo "Run Number: ${{github.run_number}}"
      - name: step level if condition
        if: github.ref == 'refs/heads/main'
        run: echo "running this from main brnach"
      - name: normally triggereing the step 
        run: echo "this normally execution"
      - name: Deploy success 
        if: success()
        run: echo "Deploy stage is success"
      - name: deploy failure
        if: failure()
        run: echo "deployment failed"
      - name: env secret testing
        run:  | 
          echo "ENV TESTING: ${{secrets.APP_STAGE}}"
      - name: env specific variable
        run:  | 
          echo "ENV specifivc variable: ${{vars.DEPLOYMENT_TYPE}}"          
        
