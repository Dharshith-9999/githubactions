name: Maven CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean package
        working-directory: github-actions-app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-app
          path: github-actions-app/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Downloading artifacts
        uses: actions/download-artifact@v4
        with:
          name: github-actions-app
          path: app
      - name: create deployment directory
        run: mkdir deployment
      - name: copy jar file from app to deployment
        run: cp -r app/ deployment/
